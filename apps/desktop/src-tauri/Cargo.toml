[package]
name = "museion-binarize-desktop"
description = "Museion Binarize desktop application (Tauri backend)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "museion_binarize_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Only ever set by scripts/distribution/package_mas.py (`tauri build
# --features mas-sandbox`) — never by ordinary `cargo build`/the GitHub
# distribution build. Selects the sandbox-compatible output-write
# strategy in worker.rs; see docs/mac-app-store-readiness.md, "Sandboxed
# output-save architecture."
mas-sandbox = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
museion-binarize-core = { path = "../../../crates/museion-binarize-core" }
