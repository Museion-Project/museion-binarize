schema = "mpdf-macos-ocr-components"
schema_version = "1.0"
target = "aarch64-apple-darwin"

# Dependency closure for the separate optional local OCR plugin artifact.
# Nothing in this manifest is required by the base desktop or CLI release.

[[component]]
formula = "tesseract"
version = "5.5.3"
license = "Apache-2.0"
homepage = "https://tesseract-ocr.github.io/"
license_files = ["LICENSE"]

[[component]]
formula = "leptonica"
version = "1.87.0"
license = "BSD-2-Clause"
homepage = "http://www.leptonica.org/"
license_files = ["README.html"]

[[component]]
formula = "libarchive"
version = "3.8.9"
license = "BSD-2-Clause"
homepage = "https://www.libarchive.org/"
license_files = ["COPYING"]

[[component]]
formula = "libpng"
version = "1.6.58"
license = "libpng-2.0"
homepage = "https://www.libpng.org/pub/png/libpng.html"
license_files = ["LICENSE"]

[[component]]
formula = "jpeg-turbo"
version = "3.2.0"
license = "IJG AND Zlib AND BSD-3-Clause"
homepage = "https://www.libjpeg-turbo.org/"
license_files = ["LICENSE.md"]

[[component]]
formula = "giflib"
version = "6.1.3"
