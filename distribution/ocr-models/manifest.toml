# --------------------------------------------------------------------------
# Rejected / development-only candidates. Kept here so a later reader can see
# what was evaluated and why it is not in the product.
# --------------------------------------------------------------------------

[[candidate]]
name = "rapidocr_onnxruntime + ch_PP-OCRv4"
engine = "rapidocr"
status = "rejected"
license = "Apache-2.0 (code); model license not separately pinned"
reason = """
The recognizer is a Chinese/English model. Its character dictionary contains
no polytonic Greek and no German umlaut coverage worth the name, which is the
direct cause of the reported ogeov / fir / U / a failures. rapidocr_onnxruntime
1.4.4 is also superseded upstream. Not a default for any profile.
"""

[[candidate]]
name = "PaddleOCR PP-OCRv5"
engine = "paddleocr"
status = "development-only"
license = "Apache-2.0 (code); per-model weights not pinned or hashed here"
reason = """
PP-OCRv5 ships an `el` recognizer for MODERN Greek. Modern Greek is monotonic:
the model is not trained on breathings, circumflex, or iota subscript, so it
cannot represent polytonic Ancient Greek at all. Weight files are fetched by
the library at first use, which violates the no-runtime-download rule. Usable
as a bake-off comparator behind an explicit flag; never a production default.
"""

[[candidate]]
name = "Kraken"
engine = "kraken"
status = "not-evaluated"
license = "Apache-2.0 (code); each published model carries its own license"
reason = """
Kraken's multi-script segmentation plus per-script recognition models is a
plausible fit for polytonic Greek and Latin/German, but each published model
must have its license, version, and SHA confirmed individually before it can
be redistributed. Not installed or measured in this round; see
docs/ocr-engines.md for what a future evaluation must establish.
"""
