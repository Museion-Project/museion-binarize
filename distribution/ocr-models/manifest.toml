# Pinned OCR model dependencies for M PDF Processor.
#
# This file is to OCR models what `distribution/pdfium/manifest.toml` is to
# PDFium: the release pipeline's own dependency list. Every entry points at a
# specific, tagged upstream release asset, with a SHA-256 that was produced by
# downloading and hashing that exact file on a developer machine -- never a
# value copied from a web page, and never "latest".
#
# Rules this file exists to enforce:
#
#   1. The application NEVER downloads a model at runtime. Models are
#      provisioned out of band by `scripts/ocr/provision_models.py` (a
#      developer/packaging tool) or shipped inside a release bundle.
#   2. A model may only be bundled or auto-provisioned when its license is
#      recorded here AND permits redistribution. A model whose license is
#      absent, unclear, or non-commercial stays a development-only candidate:
#      it never enters an app bundle and is never fetched automatically.
#   3. Changing any `sha256` below changes the OCR evidence fingerprint, which
#      invalidates existing bookmark checkpoints and candidate digests by
#      design. See docs/ocr-engines.md.

schema = "mpdf-ocr-model-manifest"
schema_version = "1.0"

# --------------------------------------------------------------------------
# Adopted production model set.
# --------------------------------------------------------------------------

[[model_set]]
name = "tessdata_best"
version = "4.1.0"
engine = "tesseract"
engine_min_version = "5.0.0"
# Tesseract itself, and the tessdata_best trained data, are Apache-2.0.
engine_license = "Apache-2.0"
engine_upstream = "https://github.com/tesseract-ocr/tesseract"
license = "Apache-2.0"
license_url = "https://github.com/tesseract-ocr/tessdata_best/blob/4.1.0/LICENSE"
upstream_project = "tessdata_best"
upstream_url = "https://github.com/tesseract-ocr/tessdata_best"
redistributable = true
# The macOS arm64 rc.3 candidate stages and smoke-tests this set. Keep the
# release-wide claim false until Windows and Linux artifacts prove the same
# self-contained contract; this field is deliberately not a per-target flag.
bundled_in_release = false
date_verified = "2026-08-28"

[[model_set.file]]
language = "grc"
description = "Ancient (polytonic) Greek, LSTM"
filename = "grc.traineddata"
