schema = "mpdf-benchmark-dataset"
schema_version = "1.0"
id = "synthetic-document-v1"
title = "Synthetic document binarization benchmark, v1"
description = "Deterministic, procedurally generated benchmark pages covering common binarization stress cases (faint/small text, noise, uneven background, broken/thick strokes, mixed text and rule lines, dense apparatus-like density, and polytonic-diacritic-like stress shapes). Contains no real text, no font-rendered glyphs, and no copyrighted material of any kind."
license = "CC0-1.0"
provenance = "Generated by mpdf-core's benchmark_fixtures module (crates/mpdf-core/src/benchmark_fixtures.rs) via this example binary (examples/gen_benchmark_fixtures.rs). Every shape is drawn procedurally from fixed geometric rules; no font, scan, or third-party image was used."
ground_truth_method = "Ground truth is the exact procedural shape drawn before any degradation is applied; it is never produced by running M PDF Processor's own binarization pipeline (which would make the benchmark circular)."
ground_truth_polarity = "black_is_zero"
ground_truth_creator = "procedural generator"
ground_truth_review_status = "not applicable (procedurally exact, not manually annotated)"

