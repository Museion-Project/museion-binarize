schema = "mpdf-benchmark-profile"
schema_version = "1.0"
id = "baseline-method-comparison"
description = "Otsu, Sauvola (defaults), and a fixed manual threshold, at 300 DPI (metadata only for the raster benchmark level — see docs/benchmark-metrics.md)."

[[runs]]
id = "otsu-300"
dpi = 300
method = "otsu"

[[runs]]
id = "sauvola-300-default"
dpi = 300
method = "sauvola"

[[runs]]
id = "manual-300-128"
dpi = 300
method = "manual"
threshold = 128
