name: Build distribution artifacts

# Manual only — this workflow NEVER runs on push/PR, and never publishes
# a GitHub Release itself. It builds and packages artifacts, uploads them
# as workflow run artifacts (private to the repository, not public
# downloads), and stops there. Publishing a Release from these artifacts
# is a deliberate separate step for a human to take — see
# docs/releasing.md, "Publication is a separate deliberate step."
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated targets to build (default: all four)"
        required: false
        default: "aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-msvc,x86_64-unknown-linux-gnu"

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    outputs:
      macos_matrix: ${{ steps.matrix.outputs.macos_matrix }}
      windows_matrix: ${{ steps.matrix.outputs.windows_matrix }}
      linux_matrix: ${{ steps.matrix.outputs.linux_matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/distribution/check_version_consistency.py
      - run: python3 scripts/distribution/test_distribution.py
      - run: python3 scripts/distribution/test_release_hardening.py
      - run: python3 scripts/distribution/check_identity_compatibility.py
      - name: Source readiness preflight
        # This workflow creates private, reviewable build artifacts. It does
        # not claim that any product profile is releasable; that stronger gate
        # is mandatory in publish-release.yml.
        run: python3 scripts/distribution/release_readiness.py --json --profile source
      # `matrix` is not a valid context in a job-level `if:` (only
      # `runs-on`, `env`, and `steps[*].if` see it) — a per-OS matrix
      # filtered from the requested `targets` input has to be computed
      # here instead and consumed by each build job's `strategy.matrix`.
      - name: Compute per-OS target matrices from the targets input
        id: matrix
        env:
          TARGETS_INPUT: ${{ github.event.inputs.targets }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os

          requested = {t.strip() for t in os.environ["TARGETS_INPUT"].split(",") if t.strip()}

          macos_runners = {
              "aarch64-apple-darwin": "macos-14",
              "x86_64-apple-darwin": "macos-15-intel",
          }
          macos_matrix = [
              {"target": target, "runner": runner}
              for target, runner in macos_runners.items()
              if target in requested
          ]
          windows_matrix = [t for t in ["x86_64-pc-windows-msvc"] if t in requested]
          linux_matrix = [t for t in ["x86_64-unknown-linux-gnu"] if t in requested]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"macos_matrix={json.dumps(macos_matrix)}\n")
              f.write(f"windows_matrix={json.dumps(windows_matrix)}\n")
              f.write(f"linux_matrix={json.dumps(linux_matrix)}\n")
          PYEOF

  macos:
    name: macOS (${{ matrix.target }})
    needs: version-check
    if: needs.version-check.outputs.macos_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.version-check.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      # Hoisted to job level so the preflight and notarization condition see
      # the same complete credential set. Values are never echoed.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Fetch and verify pinned PDFium
        run: python3 scripts/distribution/fetch_pdfium.py ${{ matrix.target }}

      - name: Stage PDFium for Tauri bundling
        run: python3 scripts/distribution/stage_desktop_pdfium.py ${{ matrix.target }}
      - name: Preflight Apple credential mode (fail closed)
        run: python3 -c "import os, sys; sys.path.insert(0, 'scripts/distribution'); import sign_macos_release; print(sign_macos_release.credential_mode(os.environ))"
      - name: PDFium release smoke gates
        env:
          MPDF_PDFIUM_LIBRARY: target/distribution/pdfium/${{ matrix.target }}/libpdfium.dylib
        run: python3 scripts/distribution/pdfium_release_smoke.py --pdfium "$MPDF_PDFIUM_LIBRARY"

      - name: Build CLI (release)
        run: cargo build -p mpdf-cli --release --target ${{ matrix.target }}

      - name: Package CLI archive
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          python3 scripts/distribution/package_cli.py \
            --target-triple ${{ matrix.target }} \
            --binary target/${{ matrix.target }}/release/mpdf \
            --pdfium-library target/distribution/pdfium/${{ matrix.target }}/libpdfium.dylib \
            --version "$VERSION" \
            --out-dir dist-out

      # `--bundles app` only — the `.dmg` is packaged in a later step,
      # after signing, from this exact `.app`. Running Tauri's own dmg
      # bundler here (or via `--bundles all`) would recompile and
      # re-bundle the `.app` again as part of producing the `.dmg`,
      # discarding whatever signature the steps below apply. See
      # scripts/distribution/package_macos_dmg.py's docstring.
      - name: Build desktop app (.app)
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ matrix.target }} --config src-tauri/tauri.dist.conf.json --bundles app

      - name: Sign macOS app (Developer ID or ad-hoc structural fallback)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          APP=$(find target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          python3 scripts/distribution/sign_macos_release.py --phase sign-app --app-path "$APP" --marker dist-out/signing-state.json

      - name: Verify macOS app bundle signature
        run: |
          APP=$(find target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package macOS .dmg from signed app bundle
        run: |
          APP=$(find target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          python3 scripts/distribution/package_macos_dmg.py \
            --app-path "$APP" --version "$VERSION" \
            --target-triple ${{ matrix.target }} \
            --out-dir target/${{ matrix.target }}/release/bundle/dmg

      - name: Notarize final macOS .dmg
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG=$(find target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name "*.dmg" | head -1)
          python3 scripts/distribution/sign_macos_release.py --phase notarize-dmg --dmg-path "$DMG" --marker dist-out/signing-state.json

      - name: Collect and rename artifacts
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          python3 - "$VERSION" "${{ matrix.target }}" <<'PYEOF'
          import shutil, sys
          from pathlib import Path
          sys.path.insert(0, "scripts/distribution")
          import naming
          version, target = sys.argv[1], sys.argv[2]
          out = Path("dist-out")
          out.mkdir(exist_ok=True)
          dmg_dir = Path(f"target/{target}/release/bundle/dmg")
          dmgs = sorted(dmg_dir.glob("*.dmg")) if dmg_dir.is_dir() else []
          if len(dmgs) != 1:
              # A stale dmg left over from an earlier/different build in
              # this same bundle/dmg directory must never be silently
              # picked (or silently overwritten) here — that is exactly
              # how a broken artifact could end up shipped again after
              # the "is damaged" bundle-signing fix. See
              # docs/desktop-testing.md, "Milestone 7A."
              print(f"::error::expected exactly 1 .dmg in {dmg_dir}, found {len(dmgs)}: {dmgs}")
              sys.exit(1)
          dest = out / naming.desktop_artifact_name(version, target, "dmg")
          shutil.copy2(dmgs[0], dest)
          print(f"copied {dmgs[0]} -> {dest}")
          PYEOF

      - name: Inspect bundled dependency architecture
        run: |
          set -e
          APP=$(find target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          LIB="$APP/Contents/Resources/libpdfium.dylib"
          test -f "$LIB" || { echo "::error::bundled PDFium library missing at $LIB"; exit 1; }
          file "$LIB"
          APP_ARCH=$(file "$APP/Contents/MacOS/"* | grep -o 'arm64\|x86_64' | head -1)
          LIB_ARCH=$(file "$LIB" | grep -o 'arm64\|x86_64' | head -1)
          if [ "$APP_ARCH" != "$LIB_ARCH" ]; then
            echo "::error::architecture mismatch: app=$APP_ARCH pdfium=$LIB_ARCH"
            exit 1
          fi
          echo "architecture OK: $APP_ARCH"

      - name: Generate checksums and release manifest
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          PDFIUM_SHA=$(python3 -c "
          import tomllib
          m = tomllib.load(open('distribution/pdfium/manifest.toml','rb'))
          for a in m['asset']:
              if a['target_triple'] == '${{ matrix.target }}':
                  print(a['library_sha256'])
          ")
          SIGNING_STATE=$(python3 -c "import json; print(json.load(open('dist-out/signing-state.json'))['signing_state'])")
          NOTARIZATION_STATE=$(python3 -c "import json; print(json.load(open('dist-out/signing-state.json'))['notarization_state'])")
          CREATED=$(python3 -c "import datetime, subprocess; print(datetime.datetime.fromtimestamp(int(subprocess.check_output(['git','show','-s','--format=%ct','HEAD'])), datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          python3 scripts/distribution/generate_sbom.py --target "${{ matrix.target }}" --version "$VERSION" --created "$CREATED" --out "dist-out/mpdf-$VERSION-${{ matrix.target }}.sbom.json"
          rm -f dist-out/signing-state.json
          for f in dist-out/*; do
            KIND=desktop
            ENTRY_SIGNING=unsigned
            ENTRY_NOTARIZATION=not_applicable
            case "$(basename "$f")" in
              *.dmg) ENTRY_SIGNING="$SIGNING_STATE"; ENTRY_NOTARIZATION="$NOTARIZATION_STATE" ;;
              mpdf-cli-*) KIND=cli ;;
              *.sbom.json) KIND=sbom ;;
            esac
            python3 scripts/distribution/release_manifest.py add \
              --manifest dist-out/release-manifest.json \
              --project-version "$VERSION" --git-sha "${{ github.sha }}" \
              --target-triple ${{ matrix.target }} --os macos --arch "$(echo ${{ matrix.target }} | cut -d- -f1)" \
              --artifact-filename "$(basename "$f")" \
              --artifact-path "$f" \
              --pdfium-build 7920 --pdfium-version 151.0.7920.0 \
              --pdfium-sha256 "$PDFIUM_SHA" \
              --signing-state "$ENTRY_SIGNING" --notarization-state "$ENTRY_NOTARIZATION" \
              --artifact-kind "$KIND" \
              --build-workflow "${{ github.workflow }}#${{ github.run_id }}"
          done
          python3 scripts/distribution/checksums.py dist-out

      - uses: actions/upload-artifact@v4
        with:
          name: mpdf-${{ matrix.target }}
          path: dist-out/
          retention-days: 14

  windows:
    name: Windows (${{ matrix.target }})
    needs: version-check
    if: needs.version-check.outputs.windows_matrix != '[]'
    strategy:
      matrix:
        target: ${{ fromJson(needs.version-check.outputs.windows_matrix) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Fetch and verify pinned PDFium
        run: python3 scripts/distribution/fetch_pdfium.py ${{ matrix.target }}
      - name: Stage PDFium for Tauri bundling
        run: python3 scripts/distribution/stage_desktop_pdfium.py ${{ matrix.target }}
      - name: PDFium release smoke gates
        shell: pwsh
        run: python3 scripts/distribution/pdfium_release_smoke.py --pdfium "target/distribution/pdfium/${{ matrix.target }}/pdfium.dll"
      # Tauri's default bundle.targets ("all") also builds an NSIS
      # installer here, alongside the MSI — deliberately not collected
      # into dist-out below. MSI is this project's chosen canonical
      # Windows installer format for publication (upgrade/uninstall
      # tracking via ProductVersion, the Windows-native "Programs &
      # Features" integration); NSIS still builds successfully (real CI
      # validation that it does), it is just not part of the published
      # asset set for this release. See docs/releasing.md, "Windows
      # artifact selection."
      - name: Build desktop app (MSI)
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ matrix.target }} --config src-tauri/tauri.dist.conf.json
      - name: Build and package CLI
        run: |
          cargo build -p mpdf-cli --release --target ${{ matrix.target }}
          python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])" > version.txt
          $VERSION = (Get-Content version.txt).Trim()
          python3 scripts/distribution/package_cli.py --target-triple ${{ matrix.target }} --binary target/${{ matrix.target }}/release/mpdf.exe --pdfium-library target/distribution/pdfium/${{ matrix.target }}/pdfium.dll --version $VERSION --out-dir dist-out
      - name: Collect MSI installer
        run: |
          $VERSION = (Get-Content version.txt).Trim()
          python3 scripts/distribution/collect_desktop_artifact.py `
            --bundle-dir target/${{ matrix.target }}/release/bundle/msi `
            --glob "*.msi" `
            --version $VERSION --target-triple ${{ matrix.target }} `
            --ext msi --out-dir dist-out
      - name: Generate checksums and release manifest
        run: |
          $VERSION = (Get-Content version.txt).Trim()
          $CREATED = python3 -c "import datetime, subprocess; print(datetime.datetime.fromtimestamp(int(subprocess.check_output(['git','show','-s','--format=%ct','HEAD'])), datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))"
          python3 scripts/distribution/generate_sbom.py --target "${{ matrix.target }}" --version $VERSION --created $CREATED --out "dist-out/mpdf-$VERSION-${{ matrix.target }}.sbom.json"
          $PDFIUM_SHA = python3 -c "import tomllib; m = tomllib.load(open('distribution/pdfium/manifest.toml','rb')); print([a['library_sha256'] for a in m['asset'] if a['target_triple'] == '${{ matrix.target }}'][0])"
          # Captured into an array before the loop starts (rather than
          # piped directly) so it is a fixed snapshot of what existed
          # before manifest generation began — release-manifest.json
          # itself, created inside this same loop, must never be able
          # to append itself as an "artifact" of its own manifest.
          $artifactsBefore = @(Get-ChildItem dist-out -File)
          foreach ($f in $artifactsBefore) {
            $kind = if ($f.Name.EndsWith('.sbom.json')) { 'sbom' } elseif ($f.Name.StartsWith('mpdf-cli-')) { 'cli' } else { 'desktop' }
            python3 scripts/distribution/release_manifest.py add `
              --manifest dist-out/release-manifest.json `
              --project-version $VERSION --git-sha "${{ github.sha }}" `
              --target-triple ${{ matrix.target }} --os windows --arch x86_64 `
              --artifact-filename $f.Name `
              --artifact-path $f.FullName `
              --pdfium-build 7920 --pdfium-version 151.0.7920.0 `
              --pdfium-sha256 $PDFIUM_SHA `
              --signing-state unsigned --notarization-state not_applicable `
              --artifact-kind $kind `
              --build-workflow "${{ github.workflow }}#${{ github.run_id }}"
          }
          python3 scripts/distribution/checksums.py dist-out
      # Authenticode signing is not required for this architecture to be
      # complete — see docs/releasing.md, "Windows signing." No
      # certificate is configured; the package below is unsigned.
      - uses: actions/upload-artifact@v4
        with:
          name: mpdf-${{ matrix.target }}
          path: dist-out/
          retention-days: 14

  linux:
    name: Linux (${{ matrix.target }})
    needs: version-check
    if: needs.version-check.outputs.linux_matrix != '[]'
    strategy:
      matrix:
        target: ${{ fromJson(needs.version-check.outputs.linux_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf file
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Fetch and verify pinned PDFium
        run: python3 scripts/distribution/fetch_pdfium.py ${{ matrix.target }}
      - name: Stage PDFium for Tauri bundling
        run: python3 scripts/distribution/stage_desktop_pdfium.py ${{ matrix.target }}
      - name: PDFium release smoke gates
        run: python3 scripts/distribution/pdfium_release_smoke.py --pdfium "target/distribution/pdfium/${{ matrix.target }}/libpdfium.so"
      # Tauri's default bundle.targets ("all") also builds an .rpm here,
      # alongside the .deb and .AppImage — deliberately not collected
      # into dist-out below. .deb and .AppImage are this project's
      # chosen canonical Linux publication formats (broad
      # distro-independent AppImage plus the most common
      # package-manager format); .rpm still builds successfully (real CI
      # validation that it does), it is just not part of the published
      # asset set for this release. See docs/releasing.md, "Linux
      # artifact selection."
      - name: Build desktop app (AppImage, deb)
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ matrix.target }} --config src-tauri/tauri.dist.conf.json
      - name: Build and package CLI
        run: |
          cargo build -p mpdf-cli --release --target ${{ matrix.target }}
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          python3 scripts/distribution/package_cli.py \
            --target-triple ${{ matrix.target }} \
            --binary target/${{ matrix.target }}/release/mpdf \
            --pdfium-library target/distribution/pdfium/${{ matrix.target }}/libpdfium.so \
            --version "$VERSION" \
            --out-dir dist-out
      - name: Collect .deb and .AppImage
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          python3 scripts/distribution/collect_desktop_artifact.py \
            --bundle-dir "target/${{ matrix.target }}/release/bundle/deb" \
            --glob "*.deb" \
            --version "$VERSION" --target-triple ${{ matrix.target }} \
            --ext deb --out-dir dist-out
          python3 scripts/distribution/collect_desktop_artifact.py \
            --bundle-dir "target/${{ matrix.target }}/release/bundle/appimage" \
            --glob "*.AppImage" \
            --version "$VERSION" --target-triple ${{ matrix.target }} \
            --ext AppImage --out-dir dist-out
      - name: Generate checksums and release manifest
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          CREATED=$(python3 -c "import datetime, subprocess; print(datetime.datetime.fromtimestamp(int(subprocess.check_output(['git','show','-s','--format=%ct','HEAD'])), datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          python3 scripts/distribution/generate_sbom.py --target "${{ matrix.target }}" --version "$VERSION" --created "$CREATED" --out "dist-out/mpdf-$VERSION-${{ matrix.target }}.sbom.json"
          PDFIUM_SHA=$(python3 -c "
          import tomllib
          m = tomllib.load(open('distribution/pdfium/manifest.toml','rb'))
          for a in m['asset']:
              if a['target_triple'] == '${{ matrix.target }}':
                  print(a['library_sha256'])
          ")
          for f in dist-out/*; do
            KIND=desktop
            case "$(basename "$f")" in *.sbom.json) KIND=sbom ;; mpdf-cli-*) KIND=cli ;; esac
            python3 scripts/distribution/release_manifest.py add \
              --manifest dist-out/release-manifest.json \
              --project-version "$VERSION" --git-sha "${{ github.sha }}" \
              --target-triple ${{ matrix.target }} --os linux --arch x86_64 \
              --artifact-filename "$(basename "$f")" \
              --artifact-path "$f" \
              --pdfium-build 7920 --pdfium-version 151.0.7920.0 \
              --pdfium-sha256 "$PDFIUM_SHA" \
              --signing-state unsigned --notarization-state not_applicable \
              --artifact-kind "$KIND" \
              --build-workflow "${{ github.workflow }}#${{ github.run_id }}"
          done
          python3 scripts/distribution/checksums.py dist-out
      - uses: actions/upload-artifact@v4
        with:
          name: mpdf-${{ matrix.target }}
          path: dist-out/
          retention-days: 14
