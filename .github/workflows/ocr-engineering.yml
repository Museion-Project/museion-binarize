name: OCR engineering contracts

on:
  push:
    branches: [codex/ocr-engineering-ci-20261002]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ocr-engineering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Synthetic Python contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/ci/ocr-engineering-requirements.txt
      - run: python -m pip install -r scripts/ci/ocr-engineering-requirements.txt
      - run: python scripts/ci/ocr_engineering.py

  desktop:
    name: Current desktop source (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/ci/ocr_engineering.py --verify-only
      - name: Source version consistency
        run: python scripts/distribution/check_version_consistency.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ocr-engineering-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Desktop local candidate unit tests
        run: cargo test --locked -p mpdf-desktop --lib --features local-ocr-candidate
      - name: Local App resource configuration parser
        run: |
          cargo build --locked -p mpdf-desktop --example resource_config_probe --features local-ocr-candidate
          python - <<'PY'
          import json, subprocess, tempfile
          from pathlib import Path
          from scripts.distribution.package_local_candidate import local_app_overlay
          from scripts.distribution.package_local_app_resources import app_resources_overlay
          root = Path.cwd()
          binary = root / 'target/debug/examples/resource_config_probe'
          base = (root / 'apps/desktop/src-tauri/tauri.conf.json').read_bytes()
          with tempfile.TemporaryDirectory() as temporary:
              folder = Path(temporary).resolve()
              overlay, inputs = local_app_overlay(root, folder / 'local-payload')
              app_overlay, _ = app_resources_overlay(root, folder / 'local-payload', folder / 'desktop-payload')
              cases = [('generated', overlay, {str(folder / 'local-payload'): 'local-ocr'}),
                       ('composed-App-resources', app_overlay,
                        {str(folder / 'local-payload'): 'local-ocr', str(folder / 'desktop-payload/pdfium/*'): './'}),
                       ('static', json.loads((root / 'apps/desktop/src-tauri/tauri.local-ocr-candidate.overlay.json').read_text()),
                        {'resources/pdfium/*': './', 'resources/local-ocr': 'local-ocr'})]
              for name, patch, expected in cases:
                  case = folder / name
                  case.mkdir()
                  (case / 'tauri.conf.json').write_bytes(base)
                  (case / 'tauri.macos.conf.json').write_text(json.dumps(patch))
                  result = json.loads(subprocess.check_output([str(binary), str(case)], text=True, timeout=30))
                  assert result['effective_resources'] == expected
                  assert result['typed_resources'] == expected
                  assert result['effective_minimum_system_version'] == '27.0'
                  assert result['typed_minimum_system_version'] == '27.0'
                  assert not result['App_started'] and result['OCR'] == result['provider'] == 0
                  print(json.dumps({'case': name, 'effective_resources': expected,
                                    'minimum_system_version': result['typed_minimum_system_version'],
                                    'config_inputs': inputs, 'App': False, 'release_ready': False}))
          PY
      - name: Default desktop remains compilable
        run: cargo check --locked -p mpdf-desktop
      - name: Evidence boundary
        run: |
          echo 'Source/component build only. No PDFium E2E, OCR quality, real GUI, install, signing, notarization or release.'
          echo 'Another Mac remains the final Release Gate. quality_ready/app_admission/distribution_ready/release_ready=false.'
