[package]
name = "mpdf-cli"
description = "Command-line interface for M PDF Processor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mpdf"
path = "src/main.rs"

[features]
# Development protocol fixture only. Production artifacts do not contain a
# broker endpoint path or the symmetric test verification secret.
dev-credits = []

[dependencies]
clap.workspace = true
mpdf-core = { path = "../mpdf-core" }
mpdf-api-client = { path = "../mpdf-api-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
