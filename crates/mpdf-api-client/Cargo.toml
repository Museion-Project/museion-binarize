[package]
name = "mpdf-api-client"
description = "Explicit-consent HTTPS client for the M PDF API protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mpdf-core = { path = "../mpdf-core" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
